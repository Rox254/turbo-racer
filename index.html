<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Turbo Racer</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 0%, #1b2233, #07090f 70%);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #fff;
    overflow: hidden;
  }
  canvas {
    background: #0d1117;
    border-radius: 16px;
    box-shadow: 0 0 0 1px #2b3550, 0 20px 60px rgba(0,0,0,.8);
    touch-action: none;
    max-width: 100vw;
    max-height: 100vh;
    display: block;
  }
</style>
</head>
<body>
<canvas id="game" width="420" height="640"></canvas>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;

  // ---------- Track geometry ----------
  const ROAD_X = 56;
  const ROAD_W = W - ROAD_X * 2;
  const LANE_W = ROAD_W / 3;
  const LANE_X = [
    ROAD_X + LANE_W * 0.5,
    ROAD_X + LANE_W * 1.5,
    ROAD_X + LANE_W * 2.5
  ];

  const CAR_W = 48;
  const CAR_H = 86;
  const ENEMY_COLORS = ['#e63946', '#f4a261', '#b5179e', '#2a9d8f', '#e9c46a', '#9b5de5'];

  // ---------- State ----------
  let state = 'ready';          // 'ready' | 'playing' | 'over'
  let keys = {};
  let player, enemies, scenery;
  let worldSpeed, distance, bonus, elapsed;
  let dashOffset, spawnTimer, overTimer, shake;
  let best = 0;

  try { best = parseInt(localStorage.getItem('turboRacerBest') || '0', 10) || 0; } catch (e) { best = 0; }

  // ---------- Helpers ----------
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    const r = Math.max(0, Math.min(255, (n >> 16) + amt));
    const g = Math.max(0, Math.min(255, ((n >> 8) & 255) + amt));
    const b = Math.max(0, Math.min(255, (n & 255) + amt));
    return `rgb(${r},${g},${b})`;
  }

  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

  function makeScenery(y) {
    const left = Math.random() < 0.5;
    const r = 9 + Math.random() * 11;
    const x = left
      ? 10 + Math.random() * (ROAD_X - 22)
      : ROAD_X + ROAD_W + 12 + Math.random() * (W - ROAD_X - ROAD_W - 22);
    return { x, y, r, hue: 120 + Math.random() * 50 };
  }

  // ---------- Setup / reset ----------
  function reset() {
    player = { x: LANE_X[1], y: H - 150, w: CAR_W, h: CAR_H, tilt: 0 };
    enemies = [];
    scenery = [];
    for (let i = 0; i < 16; i++) scenery.push(makeScenery(Math.random() * H));

    worldSpeed = 330;
    distance = 0;
    bonus = 0;
    elapsed = 0;
    dashOffset = 0;
    spawnTimer = 1.1;
    overTimer = 0;
    shake = 0;
    keys = {};
  }

  function startGame() {
    reset();
    state = 'playing';
  }

  // ---------- Spawning ----------
  function laneBlocked(lane) {
    return enemies.some(e => e.lane === lane && e.y < 230);
  }

  function spawnWave() {
    const order = [0, 1, 2].sort(() => Math.random() - 0.5);
    const want = Math.random() < 0.28 ? 2 : 1;
    let made = 0;
    for (const lane of order) {
      if (made >= want) break;
      if (laneBlocked(lane)) continue;

      enemies.push({
        lane,
        x: LANE_X[lane],
        y: -110 - Math.random() * 60,
        w: CAR_W,
        h: CAR_H,
        mult: 0.45 + Math.random() * 0.33,
        color: ENEMY_COLORS[(Math.random() * ENEMY_COLORS.length) | 0]
      });
      made++;
    }
  }

  // ---------- Input ----------
  function pointerToX(clientX) {
    const rect = canvas.getBoundingClientRect();
    return (clientX - rect.left) * (W / rect.width);
  }

  function movePointer(e) {
    if (state !== 'playing') return;
    player.x = pointerToX(e.clientX);
    clampPlayer();
  }

  function clampPlayer() {
    const minX = ROAD_X + player.w / 2 + 5;
    const maxX = ROAD_X + ROAD_W - player.w / 2 - 5;
    player.x = clamp(player.x, minX, maxX);
  }

  let pointerDown = false;

  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    canvas.setPointerCapture?.(e.pointerId);
    pointerDown = true;
    if (state === 'ready') startGame();
    else if (state === 'over' && overTimer > 0.6) startGame();
    else movePointer(e);
  });

  canvas.addEventListener('pointermove', e => {
    if (pointerDown || e.pointerType === 'mouse') movePointer(e);
  });

  canvas.addEventListener('pointerup', () => { pointerDown = false; });
  canvas.addEventListener('pointercancel', () => { pointerDown = false; });

  window.addEventListener('keydown', e => {
    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(e.key)) e.preventDefault();
    keys[e.key] = true;

    if (state === 'ready' && (e.key === ' ' || e.key === 'Enter' || e.key.startsWith('Arrow'))) {
      startGame();
    } else if (state === 'over' && overTimer > 0.6 && (e.key === ' ' || e.key === 'Enter')) {
      startGame();
    }
  });

  window.addEventListener('keyup', e => { keys[e.key] = false; });
  window.addEventListener('blur', () => { keys = {}; });

  // ---------- Update ----------
  function update(dt) {
    elapsed += dt;
    worldSpeed = Math.min(920, 330 + elapsed * 9);

    const travel = worldSpeed * dt;
    distance += travel;
    dashOffset = (dashOffset + travel) % 80;

    // scenery scroll
    for (const s of scenery) {
      s.y += travel;
      if (s.y - s.r > H + 20) {
        Object.assign(s, makeScenery(-30 - Math.random() * 40));
      }
    }

    // player steering
    let dir = 0;
    if (keys['ArrowLeft'] || keys['a'] || keys['A']) dir -= 1;
    if (keys['ArrowRight'] || keys['d'] || keys['D']) dir += 1;

    const prevX = player.x;
    if (dir !== 0) player.x += dir * 430 * dt;
    clampPlayer();

    const vx = (player.x - prevX) / Math.max(dt, 0.0001);
    const targetTilt = clamp(vx / 1500, -0.17, 0.17);
    player.tilt += (targetTilt - player.tilt) * Math.min(1, dt * 9);

    // enemies
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnWave();
      spawnTimer = Math.max(0.44, 1.0 - elapsed * 0.013);
    }

    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      e.y += worldSpeed * (1 - e.mult) * dt;

      if (e.y - e.h / 2 > H + 40) {
        enemies.splice(i, 1);
        bonus += 10;
        continue;
      }

      if (hits(player, e)) {
        crash();
        return;
      }
    }

    if (shake > 0) shake = Math.max(0, shake - dt * 60);
  }

  function hits(a, b) {
    const pad = 8;
    return Math.abs(a.x - b.x) < (a.w + b.w) / 2 - pad &&
           Math.abs(a.y - b.y) < (a.h + b.h) / 2 - pad;
  }

  function crash() {
    state = 'over';
    overTimer = 0;
    shake = 22;
    const finalScore = getScore();
    if (finalScore > best) {
      best = finalScore;
      try { localStorage.setItem('turboRacerBest', String(best)); } catch (e) {}
    }
  }

  function getScore() {
    return Math.floor(distance / 12) + bonus;
  }

  // ---------- Drawing ----------
  function drawScenery() {
    for (const s of scenery) {
      ctx.fillStyle = '#5c3d22';
      ctx.fillRect(s.x - 2, s.y, 4, s.r * 0.8);
      ctx.fillStyle = `hsl(${s.hue}, 42%, 24%)`;
      ctx.beginPath();
      ctx.arc(s.x, s.y - s.r * 0.35, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawRoad() {
    ctx.fillStyle = '#2a2d38';
    ctx.fillRect(ROAD_X, 0, ROAD_W, H);

    const g = ctx.createLinearGradient(ROAD_X, 0, ROAD_X + ROAD_W, 0);
    g.addColorStop(0, 'rgba(0,0,0,0.35)');
    g.addColorStop(0.5, 'rgba(255,255,255,0.04)');
    g.addColorStop(1, 'rgba(0,0,0,0.35)');
    ctx.fillStyle = g;
    ctx.fillRect(ROAD_X, 0, ROAD_W, H);

    // edge lines
    ctx.fillStyle = '#e8ecf5';
    ctx.fillRect(ROAD_X + 4, 0, 4, H);
    ctx.fillRect(ROAD_X + ROAD_W - 8, 0, 4, H);

    // lane dashes
    ctx.fillStyle = 'rgba(240,244,255,0.75)';
    for (let i = 1; i < 3; i++) {
      const x = ROAD_X + LANE_W * i - 2.5;
      for (let y = -80 + dashOffset; y < H; y += 80) {
        ctx.fillRect(x, y, 5, 40);
      }
    }
  }

  function drawCar(cx, cy, w, h, color, isPlayer, tilt) {
    ctx.save();
    ctx.translate(cx, cy);
    if (tilt) ctx.rotate(tilt);

    // headlight beams
    if (isPlayer) {
      ctx.globalAlpha = 0.07;
      ctx.fillStyle = '#fff6c0';
      ctx.beginPath();
      ctx.moveTo(-w / 2 + 8, -h / 2);
      ctx.lineTo(-w / 2 - 22, -h / 2 - 130);
      ctx.lineTo(w / 2 + 22, -h / 2 - 130);
      ctx.lineTo(w / 2 - 8, -h / 2);
      ctx.closePath();
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    roundRect(-w / 2 + 4, -h / 2 + 7, w, h, 13);
    ctx.fill();

    // wheels
    ctx.fillStyle = '#15171d';
    roundRect(-w / 2 - 3, -h / 2 + 14, 7, 20, 3); ctx.fill();
    roundRect(w / 2 - 4, -h / 2 + 14, 7, 20, 3); ctx.fill();
    roundRect(-w / 2 - 3, h / 2 - 34, 7, 20, 3); ctx.fill();
    roundRect(w / 2 - 4, h / 2 - 34, 7, 20, 3); ctx.fill();

    // body
    const body = ctx.createLinearGradient(-w / 2, 0, w / 2, 0);
    body.addColorStop(0, shade(color, -45));
    body.addColorStop(0.4, color);
    body.addColorStop(1, shade(color, -55));
    ctx.fillStyle = body;
    roundRect(-w / 2, -h / 2, w, h, 13);
    ctx.fill();

    // roof / cabin
    ctx.fillStyle = shade(color, -18);
    roundRect(-w / 2 + 7, -h / 2 + 18, w - 14, h - 36, 8);
    ctx.fill();

    // windshield
    const glass = ctx.createLinearGradient(0, -h / 2, 0, 0);
    glass.addColorStop(0, '#9fd8ff');
    glass.addColorStop(1, '#2b4a63');
    ctx.fillStyle = glass;
    roundRect(-w / 2 + 10, -h / 2 + 20, w - 20, 22, 6);
    ctx.fill();

    // rear window
    ctx.fillStyle = '#243a4d';
    roundRect(-w / 2 + 12, h / 2 - 32, w - 24, 16, 5);
    ctx.fill();

    // racing stripe
    if (isPlayer) {
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.fillRect(-3, -h / 2 + 6, 6, h - 12);
    }

    // headlights
    ctx.fillStyle = isPlayer ? '#fff9c4' : '#d8d8d8';
    roundRect(-w / 2 + 8, -h / 2 + 5, 11, 7, 3); ctx.fill();
    roundRect(w / 2 - 19, -h / 2 + 5, 11, 7, 3); ctx.fill();

    // taillights
    ctx.fillStyle = isPlayer ? '#ff4d4d' : '#ff2d2d';
    roundRect(-w / 2 + 8, h / 2 - 12, 11, 7, 3); ctx.fill();
    roundRect(w / 2 - 19, h / 2 - 12, 11, 7, 3); ctx.fill();

    ctx.restore();
  }

  function drawHUD() {
    ctx.save();
    ctx.fillStyle = 'rgba(10,14,24,0.55)';
    roundRect(12, 12, 150, 40, 12); ctx.fill();
    roundRect(W - 148, 12, 136, 40, 12); ctx.fill();

    ctx.fillStyle = '#7fe7ff';
    ctx.font = 'bold 20px system-ui, sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText('SCORE', 26, 32);

    ctx.fillStyle = '#fff';
    ctx.textAlign = 'right';
    ctx.fillText(String(getScore()), 150, 32);

    ctx.fillStyle = '#ffd166';
    ctx.textAlign = 'left';
    ctx.fillText('BEST', W - 134, 32);

    ctx.fillStyle = '#fff';
    ctx.textAlign = 'right';
    ctx.fillText(String(best), W - 26, 32);

    // speed bar
    const pct = clamp((worldSpeed - 330) / 590, 0, 1);
    ctx.fillStyle = 'rgba(10,14,24,0.55)';
    roundRect(12, H - 34, W - 24, 20, 10); ctx.fill();
    const spd = ctx.createLinearGradient(16, 0, W - 16, 0);
    spd.addColorStop(0, '#4cc9f0');
    spd.addColorStop(0.6, '#ffd166');
    spd.addColorStop(1, '#ef476f');
    ctx.fillStyle = spd;
    roundRect(16, H - 30, (W - 32) * pct, 12, 6); ctx.fill();

    ctx.restore();
  }

  function drawOverlay() {
    if (state === 'playing') return;
    ctx.fillStyle = 'rgba(5,8,15,0.78)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    if (state === 'ready') {
      ctx.fillStyle = '#4cc9f0';
      ctx.font = 'bold 44px system-ui, sans-serif';
      ctx.fillText('TURBO', W / 2, H / 2 - 120);
      ctx.fillStyle = '#fff';
      ctx.fillText('RACER', W / 2, H / 2 - 72);

      ctx.font = '17px system-ui, sans-serif';
      ctx.fillStyle = '#c3cede';
      ctx.fillText('Dodge traffic. Survive. Score.', W / 2, H / 2 - 10);

      ctx.fillStyle = '#9fb0c9';
      ctx.font = '15px system-ui, sans-serif';
      ctx.fillText('← →  or  A / D  or  drag', W / 2, H / 2 + 34);

      ctx.fillStyle = '#4cc9f0';
      ctx.font = 'bold 20px system-ui, sans-serif';
      const pulse = 0.6 + 0.4 * Math.sin(performance.now() / 300);
      ctx.globalAlpha = pulse;
      ctx.fillText('CLICK  /  PRESS SPACE', W / 2, H / 2 + 100);
      ctx.globalAlpha = 1;

      if (best > 0) {
        ctx.fillStyle = '#ffd166';
        ctx.font = '16px system-ui, sans-serif';
        ctx.fillText('Best: ' + best, W / 2, H / 2 + 150);
      }
    } else {
      ctx.fillStyle = '#ef476f';
      ctx.font = 'bold 42px system-ui, sans-serif';
      ctx.fillText('CRASHED', W / 2, H / 2 - 100);

      ctx.fillStyle = '#fff';
      ctx.font = 'bold 26px system-ui, sans-serif';
      ctx.fillText('Score: ' + getScore(), W / 2, H / 2 - 30);

      ctx.fillStyle = '#ffd166';
      ctx.font = '19px system-ui, sans-serif';
      ctx.fillText('Best: ' + best, W / 2, H / 2 + 10);

      if (overTimer > 0.6) {
        ctx.fillStyle = '#4cc9f0';
        ctx.font = 'bold 19px system-ui, sans-serif';
        const pulse = 0.55 + 0.45 * Math.sin(performance.now() / 280);
        ctx.globalAlpha = pulse;
        ctx.fillText('CLICK  /  PRESS SPACE', W / 2, H / 2 + 90);
        ctx.globalAlpha = 1;
      }
    }
  }

  function draw() {
    ctx.save();
    if (shake > 0) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }

    // grass
    ctx.fillStyle = '#102a20';
    ctx.fillRect(-30, -30, W + 60, H + 60);

    drawScenery();
    drawRoad();

    // enemies
    for (const e of enemies) {
      drawCar(e.x, e.y, e.w, e.h, e.color, false, 0);
    }

    // player
    if (state !== 'over') {
      drawCar(player.x, player.y, player.w, player.h, '#4cc9f0', true, player.tilt);
    }

    drawHUD();
    ctx.restore();

    drawOverlay();
  }

  // ---------- Loop ----------
  let last = 0;

  function loop(t) {
    if (!last) last = t;
    let dt = (t - last) / 1000;
    last = t;
    if (dt > 0.05) dt = 0.05;

    if (state === 'playing') {
      update(dt);
    } else {
      overTimer += dt;
      // let scenery keep drifting on the ready screen
      if (state === 'ready') {
        const travel = 240 * dt;
        dashOffset = (dashOffset + travel) % 80;
        for (const s of scenery) {
          s.y += travel;
          if (s.y - s.r > H + 20) Object.assign(s, makeScenery(-30));
        }
      }
    }

    draw();
    requestAnimationFrame(loop);
  }

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
